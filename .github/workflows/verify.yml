name: Moatt CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run assets:verify
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-static-release.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moatt-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
