name: Deploy Moatt to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run assets:verify
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
          NEXT_PUBLIC_BASE_PATH: '/moatt'
      - run: node scripts/check-static-release.mjs
      - run: touch out/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: moatt-static-site
          path: './out'
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './out'
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check published website and mannequin
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://enyina.github.io/moatt"
          for i in $(seq 1 12); do
            if curl --fail --location --silent --show-error "$BASE/" -o /tmp/moatt-home.html && grep -q "MOATT" /tmp/moatt-home.html && curl --fail --location --silent --show-error "$BASE/models/mannequin.glb" -o /tmp/moatt-model.glb; then
              test "$(wc -c </tmp/moatt-model.glb)" -gt 10000
              echo "Published Moatt site and mannequin asset verified"
              exit 0
            fi
            sleep 10
          done
          echo "Published website failed smoke checks" >&2
          exit 1
